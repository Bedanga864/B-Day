<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Special Day Message</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #fce4ec; /* Light pink background */
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .message-box {
      background: white;
      padding: 40px 60px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      text-align: center;
      font-size: 1.5rem;
      font-weight: bold;
      color: #333;
      z-index: 2;
    }

    .message-box .star {
      font-size: 1.8rem;
      display: block;
      color: #ffc107;
      margin-bottom: 10px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(to bottom, #ffe6f0, #ffffff);
      color: #333;
      text-align: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    h1 {
      font-family: 'Pacifico', cursive;
      font-size: 2.5em;
      margin: 30px 0;
      animation: fadeInDown 1.5s ease;
      position: relative;
      z-index: 2;
    }

    p {
      font-size: 1.2em;
      margin: 20px auto;
      max-width: 90%;
      line-height: 1.6;
      animation: fadeInUp 2s ease;
      position: relative;
      z-index: 2;
    }

    .text-heart {
      color: red;
      font-size: 2em;
      animation: pulse 2s infinite;
    }

    .section {
      margin-top: 60px;
      animation: fadeIn 2.5s ease-in-out;
      position: relative;
      z-index: 2;
    }

    .next-button {
      display: inline-block;
      margin-top: 40px;
      padding: 12px 24px;
      background-color: #ff69b4;
      color: white;
      font-size: 1.1em;
      font-weight: bold;
      text-decoration: none;
      border-radius: 30px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease;
      position: relative;
      z-index: 3;
    }

    .next-button:hover {
      background-color: #ff1493;
      transform: scale(1.05);
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    /* Floating Heart Decorations */
    .wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .floating-heart,
    .altheart {
      position: absolute;
      pointer-events: none;
    }

    .floating-heart:before,
    .floating-heart:after {
      content: "";
      position: absolute;
      left: 18px;
      top: 0;
      width: 18px;
      height: 30px;
      background: #CC2022;
      border-radius: 30px 30px 0 0;
      transform: rotate(-45deg);
      transform-origin: 0 100%;
    }

    .floating-heart:after {
      left: 0;
      transform: rotate(45deg);
      transform-origin: 100% 100%;
    }

    .altheart {
      background: url(https://static.indigoimages.ca/2016/shop/113439_img25_twotoneheart.png) no-repeat center;
      width: 24px;
      height: 21px;
    }

    .x1 { left: 5%; transform: scale(0.9); opacity: 0.6; animation: moveclouds 15s linear infinite, sideWays 4s ease-in-out infinite alternate; }
    .x2 { left: 25%; transform: scale(0.6); opacity: 0.9; animation: moveclouds 25s linear infinite, sideWays 5s ease-in-out infinite alternate; }
    .x3 { left: 55%; transform: scale(0.8); opacity: 0.8; animation: moveclouds 20s linear infinite, sideWays 4s ease-in-out infinite alternate; }
    .x4 { left: 72%; transform: scale(0.75); opacity: 0.9; animation: moveclouds 18s linear infinite, sideWays 2s ease-in-out infinite alternate; }
    .x5 { left: 88%; transform: scale(0.8); opacity: 0.3; animation: moveclouds 7s linear infinite, sideWays 1s ease-in-out infinite alternate; }
    .x6 { left: 33%; opacity: 1; animation: moveclouds 10s linear infinite, swayWays 9s ease-in-out infinite alternate; }

    @keyframes moveclouds {
      0% { top: 100%; }
      100% { top: -100px; }
    }

    @keyframes sideWays {
      0% { margin-left: 0px; }
      100% { margin-left: 50px; }
    }

    @keyframes swayWays {
      0% { transform: rotate(12deg); left: -0.3%; }
      33% { transform: rotate(-2deg); left: 0.7%; }
      100% { transform: rotate(0deg); left: -12%; }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="floating-heart x1"></div>
    <div class="floating-heart x2"></div>
    <div class="floating-heart x3"></div>
    <div class="floating-heart x4"></div>
    <div class="floating-heart x5"></div>
    <div class="altheart x6"></div>
  </div>

  <div class="message-box">
    <span class="star">✨</span>
    To do Something Special for you are always special to me 
  </div>
  
  <a href="pi4.html" class="next-button">Next &gt;</a>
</body>
</html>
