<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Message</title>
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: 	#F8C8DC;
      }

      .envelope {
        position: relative;
        cursor: pointer;
      }

      .back {
  position: relative;
  width: 300px;
  height: 240px;
  background: #E0BFB8; /* Light parchment-like color */
  border: 1px solid #dcd6cf;
  box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
  z-index:;
}

.front {
  position: absolute;
  border-right: 155px solid #E0BFB8;
  border-top: 120px solid transparent;
  border-bottom: 120px solid transparent;
  height: 0;
  width: 0;
  top: 0;
  left: 145px;
  z-index: 3;
}

.front:before {
  content: "";
  position: absolute;
  border-left: 155px solid #E0BFB8;
  border-top: 120px solid transparent;
  border-bottom: 120px solid transparent;
  height: 0;
  width: 0;
  top: -120px;
  left: -145px;
}

.front:after {
  content: "";
  position: absolute;
  border-bottom: 125px solid #eae5df; /* Slightly darker for contrast */
  border-left: 150px solid transparent;
  border-right: 150px solid transparent;
  height: 0;
  width: 0;
  top: -5px;
  left: -145px;
}

.top {
  position: absolute;
  border-top: 125px solid #e4ded7; /* Top flap of envelope */
  border-left: 150px solid transparent;
  border-right: 150px solid transparent;
  height: 0;
  width: 0;
  top: 0;
  transform-origin: top;
  transition: 0.4s ease;
}

      .envelope:hover .top {
        transform: rotateX(160deg);
      }

      .letter {
        position: absolute;
        background: white;
        width: 270px;
        height: 210px;
        top: 15px;
        left: 15px;
        transition: 0.2s;
      }

      .envelope:hover .letter {
        transform: translateY(-110px);
        z-index: 2;
      }
	   
		
      .text1 {
        position: absolute;
        color: white;
        font-family: sans-serif;
        top: -50%;
        text-align: center;
        width: 100%;
      }

      .text {
        text-align: center;
        font-size: 12px;
        font-family: Arial, Helvetica, sans-serif;
        margin-top: 20px;
        font-weight: bold;
        color: black;
        position: relative;
        top: -20px;
        left: 20px;
      }

      /*---heart -----*/
      .heart {
        background-color: red;
        height: 70px;
        width: 70px;
        position: relative;
        top: 25px;
        left: 25px;
        transform: rotate(-45deg);
        box-shadow: -5px 10px 90px red;
        animation: untoldcoding 0.8s linear infinite;
      }

      @keyframes untoldcoding {
        0% {
          transform: rotate(-45deg) scale(1.05);
        }
        70% {
          transform: rotate(-45deg) scale(1);
        }
        100% {
          transform: rotate(-45deg) scale(0.8);
        }
      }

      .heart:before {
        content: "";
        position: absolute;
        height: 70px;
        width: 70px;
        background-color: red;
        top: -40px;
        border-radius: 50px;
      }

      .heart:after {
        content: "";
        position: absolute;
        height: 70px;
        width: 70px;
        background-color: red;
        right: -40px;
        border-radius: 50px;
      }
    </style>
  </head>
  <body>
    <div class="envelope">
      <div class="back"></div>
      <div class="letter">
        <div class="heart"></div>
        <div class="text">
          <p>
            I want to say <br />
            many things but, <br />
            I can't express so I made <br />
            this for you
          </p>
          <a href="message2.html">Click here</a>
        </div>
      </div>
      <div class="front"></div>
      <div class="top"></div>
      <div class="shadow"></div>
      <div class="text1">
        <h2>Hey! Listen I Have Something For You</h2>
      </div>
    </div>
  </body>
</html>
